      <h1 id="case-title">Lark: make internationalization part of everyday design delivery<span class="accent-text">.</span></h1>
      <p class="case-principle">A multilingual experience depends on translation, layout, typography, platform behavior, and how teams hand off the work.</p>
      <dl class="case-facts" aria-label="At a glance">
        <div><dt>Product</dt><dd>Lark collaboration suite</dd></div>
        <div><dt>My role</dt><dd>Multilingual standards and workflow design</dd></div>
        <div><dt>Collaboration</dt><dd>Engineering, R&amp;D, and content teams</dd></div>
        <div><dt>Focus</dt><dd>Design rules, translation-tool behavior, and verification</dd></div>
      </dl>
    </section>

      <div class="story-sections">
        <section id="problem" class="story-section">
          <p class="eyebrow">01 / More than translation</p>
          <h2>Every language brings its own layout questions.</h2>
          <p>In a multilingual collaboration product, translated text can change line breaks, text length, font weight, and component rendering across platforms. Even an accurate translation can leave a screen cramped or inconsistent.</p>
          <p>Designers, content partners, and engineers also needed to agree on release checks and multilingual file handoff. I led that collaboration to clarify the rules and each team's responsibilities.</p>
          <figure class="lark-evidence-figure">
            <picture>
              <source type="image/webp" srcset="/assets/lark-handoff-tooling-1600.webp 1600w, /assets/lark-handoff-tooling-2400.webp 2400w, /assets/lark-handoff-tooling-3200.webp 3200w" sizes="(max-width: 600px) calc(100vw - 40px), (max-width: 1100px) calc(100vw - 64px), (max-width: 1264px) calc(100vw - 96px), 1168px">

            </picture>
            <figcaption>Reporting and feedback-triage materials for monitoring internationalization issues.</figcaption>
          </figure>
        </section>

        <section id="standards" class="story-section">
          <p class="eyebrow">02 / Make language behavior explicit</p>
          <h2>Turn edge cases into design guidance teams can reuse.</h2>
          <p>I helped define standards for word boundaries, line breaks, overflow, font behavior, platform rendering, and component adaptation. We wanted multilingual behavior specified during design, before translated text was placed for a final visual check.</p>
          <p>These rules tied language choices to layout and typography, helping teams check whether a screen would remain readable after translation.</p>
          <figure class="lark-evidence-figure">
            <picture>
              <source type="image/webp" srcset="/assets/lark-project-examples-1600.webp 1600w, /assets/lark-project-examples-2400.webp 2400w, /assets/lark-project-examples-3200.webp 3200w" sizes="(max-width: 600px) calc(100vw - 40px), (max-width: 1100px) calc(100vw - 64px), (max-width: 1264px) calc(100vw - 96px), 1168px">
              <img src="/assets/lark-project-examples.png" width="3442" height="1838" loading="lazy" decoding="async" alt="Lark multilingual design guideline and supporting board of interface, typography, line-break, and localization examples.">
            </picture>
            <figcaption>The guideline sits alongside working examples for multilingual copy, layout, and typography.</figcaption>
          </figure>
        </section>

        <section id="workflow" class="story-section">
          <p class="eyebrow">03 / Put checks in the workflow</p>
          <h2>Make the right work easier to repeat.</h2>
          <p>I defined how a Figma translation tool would retrieve translations, compare UX copy, adjust font weights, and assign font tokens. I led its development with R&amp;D and content partners.</p>
          <p>We included the tool in the handoff SOP so the checks became part of the team's delivery process. Translation, typography, and implementation guidance could then accompany the work in one place.</p>
          <dl class="format-directions">
            <div><dt>Translation content</dt><dd>Retrieve and compare the language content used in the design.</dd></div>
            <div><dt>Typography</dt><dd>Check font weight and apply the appropriate font tokens.</dd></div>
            <div><dt>Handoff</dt><dd>Include multilingual requirements in the shared design-to-engineering handoff.</dd></div>
          </dl>
          <figure class="lark-evidence-figure">
            <picture>
              <source type="image/webp" srcset="/assets/lark-multilingual-guideline-1600.webp 1600w, /assets/lark-multilingual-guideline-2400.webp 2400w, /assets/lark-multilingual-guideline-3200.webp 3200w" sizes="(max-width: 600px) calc(100vw - 40px), (max-width: 1100px) calc(100vw - 64px), (max-width: 1264px) calc(100vw - 96px), 1168px">
              <img src="/assets/lark-multilingual-guideline.png" width="3440" height="1834" loading="lazy" decoding="async" alt="Lark design handoff SOP and Figma translation-tool documentation, with examples of translation content and tool interfaces.">
            </picture>
            <figcaption>Handoff guidance and translation-tool examples documented together.</figcaption>
          </figure>
        </section>

        <section id="verification" class="story-section outcome-section">
          <p class="eyebrow">04 / Verify what ships</p>
          <h2>Make font behavior and open issues visible.</h2>
          <p>I defined cross-platform font-replacement checks using distinctive characters, along with ways to collect and track open internationalization issues. Teams could use the same rendering checks and follow unresolved issues across product work.</p>
          <p>We applied these rules to Lark Project's Chinese, English, and Japanese font scheme. Browser fallbacks and variable fonts helped keep typography balanced across platforms.</p>
          <p>Standards, translation-tool behavior, handoff, and verification became part of the regular design-delivery process.</p>
