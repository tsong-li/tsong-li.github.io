        <section id="overview" class="story-section">
          <p class="eyebrow">01 / Overview &amp; contribution</p>
          <h2>Four details that shape how a report is read and shared.</h2>
          <p>People needed to read and share the reports generated by Deep Research. My work covered four parts of that experience: charts within reports, report cards in Copilot Web, redesigned sharing on mobile and web, and the Promotion Card for the feature launch.</p>
          <p>I led design for these report-experience enhancements as part of the wider Deep Research team.</p>
        </section>

            <div><dt>Sharing<br> on web and mobile</dt><dd>I redesigned sharing to clarify what would be included with the report.</dd></div>
          </dl>

        <section id="scope" class="story-section">
          <p class="eyebrow">03 / The sharing decision</p>
          <h2>Show people what will travel with the report.</h2>
          <p>Before the redesign, there was no sharing preview. People could not tell whether they would share the report or the entire conversation. This mattered because the conversation could include unrelated or sensitive discussion.</p>
          <p>I wanted people to see what they were about to share. The starting point could determine how much context to include: sharing from a conversation could include the prompt that led to the report, while sharing from the report itself could include only a link to the report.</p>
        </section>

        <section id="contexts" class="story-section">
          <p class="eyebrow">04 / Two sharing contexts</p>
          <h2>Where you start shapes what you share.</h2>
          <dl class="format-directions">
            <div><dt>From<br> the conversation</dt><dd>Sharing from the conversation opens a preview of the prompt that triggered the report and the report itself. Only these two items are shared; the rest of the conversation is excluded. The prompt gives the recipient context for understanding the report.</dd></div>
            <div><dt>From<br> the report detail page</dt><dd>From the report detail page, a share contains only a link to the report content, without the prompt or any added conversation context.</dd></div>
          </dl>
          <p>Conversation shares include the prompt; report-detail shares include only a report link.</p>
        </section>

        <section id="delivery" class="story-section">
          <p class="eyebrow">05 / Delivery &amp; outcome</p>
          <h2>All four enhancements shipped.</h2>
          <p>The shipped work included charts in reports, the Copilot Web Report Card, redesigned sharing on web and mobile, and the launch Promotion Card.</p>
          <p>The sharing design aimed to show people exactly what they would share and give recipients enough context to understand the report.</p>
        </section>

        <section id="takeaway" class="story-section outcome-section">
          <p class="eyebrow">06 / Design takeaway</p>
          <h2>Make the boundary part of the share.</h2>
          <p>Sharing involves both a destination and the content the recipient will see. Showing the included content before it leaves the conversation helps the sender understand the scope.</p>
          <p>The conversation preview paired the prompt with its report; sharing from the report detail page included only a report link. The design made the different amounts of context clear at each starting point.</p>
        </section>
