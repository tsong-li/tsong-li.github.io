      <h1 id="case-title">Discover Finance: making proactive updates feel relevant<span class="accent-text">.</span></h1>
      <p class="case-principle">Help finance updates feel grounded in what the user already follows and cares about.</p>
      <dl class="case-facts" aria-label="At a glance">
        <div><dt>Product</dt><dd>Microsoft Copilot Discover</dd></div>
        <div><dt>Portfolio context</dt><dd>2025–2026</dd></div>
        <div><dt>Feed design</dt><dd>2026</dd></div>
        <div><dt>Focus</dt><dd>Personal relevance and stock-card structure across desktop and mobile</dd></div>
      </dl>
    </section>

    <figure class="discover-hero-figure discover-final-figure">
      <img class="discover-final-image" src="/assets/discover-finance-feed-final-1600.webp" srcset="/assets/discover-finance-feed-final-800.webp 800w, /assets/discover-finance-feed-final-1600.webp 1600w" sizes="(max-width: 600px) calc(100vw - 40px), (max-width: 1100px) calc(100vw - 64px), (max-width: 1264px) calc(100vw - 96px), 1168px" width="3840" height="2160" decoding="async" alt="Finance feed design: a desktop feed alongside mobile market-brief and stock-event views">

    </figure>

    <div class="case-story">
      <aside class="case-contents">
        <p class="eyebrow">In this case</p>
        <nav aria-label="Case contents"><a href="#challenge">01 / The product question</a><a href="#structure">02 / Make relevance explicit</a><a href="#mobile-cards">03 / Define the content unit</a><a href="#directions">04 / Give depth a purpose</a><a href="#delivery">05 / What carries forward</a></nav>
      </aside>
      <div class="story-sections">
        <section id="challenge" class="story-section">
          <p class="eyebrow">01 / The product question</p>
          <h2>Why should finance belong in this feed?</h2>
          <p>Bringing finance into Discover meant asking people to engage with content they had not explicitly requested in that moment. My first concern was whether a market update would feel connected to their habits and interests.</p>
          <p>The design needed to make that connection visible before presenting Finance insight and Stock modules. The goal was to reduce resistance to recommended content and create a useful entry into related information and services.</p>
          <p>Two decisions shaped my work: how introductory copy establishes personal relevance, and whether mobile stock updates should keep the web structure of one stock per card.</p>
        </section>

        <section id="structure" class="story-section">
          <p class="eyebrow">02 / Make relevance explicit</p>
          <h2>Explain why the update is here before asking for attention.</h2>
          <p>I placed personalized introductory copy before the Finance insight and Stock modules. It connects an update to an interest the user has shown, then explains the development that makes it worth surfacing now.</p>
          <p>The pitch compares a general market brief with a personalized version. The general view centers on market indices; the personalized view combines market context with companies of interest. The opening message and the explanation change with that selection.</p>
          <p>The introduction has a product role: it connects Copilot’s understanding of the user to the content being recommended. This is where the experience needs to make its reason for relevance understandable.</p>
          <figure class="discover-motion-figure">
            <video class="discover-motion-video" controls playsinline muted preload="none" poster="/assets/discover-market-brief-poster.jpg" width="3456" height="2168" aria-label="Mobile market-brief views, general and personalized, showing index summaries, charts, and context">
              <source src="/assets/discover-market-brief-motion.mp4" type="video/mp4">
            </video>
            <a class="discover-motion-source" href="/assets/discover-market-brief-motion.mp4">Open market-brief video in browser</a>
            <figcaption>Mobile market brief: a short silent recording of general and personalized views, with index summaries, charts, and explanatory context. Figures are illustrative, not live data.</figcaption>
          </figure>
        </section>

        <section id="mobile-cards" class="story-section">
          <p class="eyebrow">03 / Define the content unit</p>
          <h2>Should mobile keep one stock per card?</h2>
          <p>My second decision was whether mobile should keep the same stock-card structure as the web experience. I separated the exploration into two choices: one or two introductory groups, and combined or separate stock cards.</p>
          <p>Intro grouping determines whether market context and company updates share one opening. Card grouping determines whether readers encounter a continuous briefing or individual company updates. Comparing the two separately made the trade-off clearer.</p>
          <div class="discover-layout-exploration" role="group" aria-label="Four mobile card-layout variants">
            <dl class="discover-layout-axes">
              <dt>Intro grouping</dt><dd>One group or two</dd>
              <dt>Stock cards</dt><dd>Combined or separate</dd>
            </dl>
            <div class="discover-layout-grid">
              <figure class="discover-layout-variant">
                <img src="/assets/discover-card-layout-one-group-combined.png" width="920" height="2936" loading="lazy" decoding="async" alt="One intro group followed by a combined card containing the market brief and stock updates">
                <figcaption><span>One group</span><span>Combined cards</span></figcaption>
              </figure>
              <figure class="discover-layout-variant">
                <img src="/assets/discover-card-layout-two-groups-combined.png" width="925" height="2936" loading="lazy" decoding="async" alt="Two intro groups separating the market brief from stock updates in one combined card">
                <figcaption><span>Two groups</span><span>Combined cards</span></figcaption>
              </figure>
              <figure class="discover-layout-variant">
                <img src="/assets/discover-card-layout-one-group-separated.png" width="926" height="2936" loading="lazy" decoding="async" alt="One intro group followed by separate market-brief and stock-update cards">
                <figcaption><span>One group</span><span>Separate cards</span></figcaption>
              </figure>
              <figure class="discover-layout-variant">
                <img src="/assets/discover-card-layout-two-groups-separated.png" width="919" height="2936" loading="lazy" decoding="async" alt="Two intro groups with separate market-brief and stock-update cards">
                <figcaption><span>Two groups</span><span>Separate cards</span></figcaption>
              </figure>
            </div>
            <p class="discover-layout-caption">Four visual combinations across two choices: one or two intro groups, with stock updates combined or separate. These are layout alternatives, not user-test results. Market figures are illustrative.</p>
          </div>
          <div class="discover-layout-links">
            <a href="/assets/discover-mobile-card-layout-exploration.png">View full four-variant comparison</a>
            <a href="https://www.figma.com/design/9VgXijoGldIkSpa2AFxb0D/Feb.-10-One-Group-Design?node-id=2244-102675&amp;m=dev" target="_blank" rel="noopener noreferrer" aria-label="View source in Figma, opens in a new tab"><span>View source in Figma</span><span class="sr-only">Opens in a new tab</span></a>
          </div>
          <p>I kept one card per stock to fit the existing feed framework, where each card represents one content item. On mobile, I removed nonessential titles and shortened descriptions to fit that structure.</p>
          <p>The trade-off is between a continuous multi-stock briefing and a clear boundary around each company update. The shared introduction provides the connection; each card carries the company, price movement, event explanation, and sources needed to make sense on its own.</p>
          <figure class="discover-motion-figure">
            <video class="discover-motion-video" controls playsinline muted preload="none" poster="/assets/discover-stock-update-poster.jpg" width="3680" height="2392" aria-label="Mobile stock-update cards showing company, price movement, event explanations, and sources">
              <source src="/assets/discover-stock-update-motion.mp4" type="video/mp4">
            </video>
            <a class="discover-motion-source" href="/assets/discover-stock-update-motion.mp4">Open stock-update video in browser</a>
            <figcaption>Mobile stock update: a short silent recording of stacked company cards with price movement, event summaries, and sources. Figures are illustrative, not live data.</figcaption>
          </figure>
        </section>

        <section id="directions" class="story-section">
          <p class="eyebrow">04 / Give depth a purpose</p>
          <h2>Each level should answer a different question.</h2>
          <p>Once an update has earned attention, the next view needs to add context. The pitch called for credible market voices and videos that contribute information beyond the written brief, with a page that can be scanned before a deeper read.</p>
          <dl class="format-directions">
            <div><dt>Feed</dt><dd>What deserves my attention? Connect a meaningful event to the reader’s interests, with enough explanation to judge whether to open it.</dd></div>
            <div><dt>Market view</dt><dd>What is happening around this event? Bring together the market summary, indices, drivers, sources, and complementary media.</dd></div>
            <div><dt>Stock exploration</dt><dd>What would help me examine this company? Organize performance, peer comparisons, earnings, and fundamentals around progressively deeper questions.</dd></div>
          </dl>
          <figure class="discover-pitch-figure">
            <a class="discover-pitch-image-link" href="/assets/discover-pitch-reading-depth.png" target="_blank" rel="noopener noreferrer" aria-label="View full-size pitch slide, opens in a new tab">
              <img src="/assets/discover-pitch-reading-depth-1920.webp" srcset="/assets/discover-pitch-reading-depth-960.webp 960w, /assets/discover-pitch-reading-depth-1920.webp 1920w" sizes="(max-width: 600px) calc(100vw - 40px), (max-width: 1100px) calc(100vw - 64px), 816px" width="1920" height="1080" loading="lazy" decoding="async" alt="Original Finance pitch showing a market consumption page that pairs a contextual written summary with a finance video and source information.">
            </a>
            <figcaption>Original pitch / A market detail view pairs a written interpretation with complementary video. The slide sets out a scannable-first reading approach.</figcaption>
            <a class="case-image-link" href="/assets/discover-pitch-reading-depth.png" target="_blank" rel="noopener noreferrer">View full-size pitch slide<span class="sr-only"> (opens in a new tab)</span></a>
          </figure>
          <p>The Stock exploration extends this approach with questions about investor sentiment, forecasts, and fundamentals relative to peers. Charts sit within those questions, giving the reader a reason to examine each data view.</p>
        </section>

        <section id="delivery" class="story-section">
          <p class="eyebrow">05 / What carries forward</p>
          <h2>Relevance needs both an explanation and a structure.</h2>
          <p>The two decisions are connected. The introduction explains why a module belongs in the user’s feed; the card structure determines how that relevance is carried across screens and reading contexts.</p>
          <p>For other proactive content experiences, I would begin with the same questions: what makes this worth showing to this person now, what is the smallest content unit that still makes sense, and what new value does the next level of reading provide?</p>
        </section>
