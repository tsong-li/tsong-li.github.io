      <h1 id="case-title">Copilot Temporary Chat: make the mode clear<span class="accent-text">.</span></h1>
      <p class="case-principle">Temporary Chat should be easy to find and clear once it is active.</p>
      <dl class="case-facts" aria-label="At a glance">
        <div><dt>Product</dt><dd>Microsoft Copilot<br>Temporary Chat</dd></div>
        <div><dt>Contribution</dt><dd>End-to-end product design across web and mobile</dd></div>
        <div><dt>Scope</dt><dd>Flows, interactions, interface design, and exploration of entry points, icons, and motion</dd></div>
        <div><dt>Delivery</dt><dd>The web and mobile experience shipped; the paired transition animations did not</dd></div>
      </dl>
    </section>

      <div class="story-sections">
        <section id="context" class="story-section">
          <p class="eyebrow">01 / Context &amp; contribution</p>
          <h2>Help people find the mode and recognize it once they are in.</h2>
          <p>User research revealed significant privacy concerns. Worries about how conversations might be remembered or used could keep people from engaging fully with Copilot. The Productivity Core squad was developing an option for temporary conversations about personal, sensitive, or taboo topics, later named Temporary Chat. My work focused on making the option easy to find and the active mode clear once a conversation began.</p>
          <p>I led end-to-end design for web and mobile, working with the wider product team on flows, interactions, and interface details. I focused on three moments in the experience: finding the option, recognizing when it was active, and knowing when the conversation returned to standard mode.</p>
        </section>

        <section id="clarity" class="story-section">
          <p class="eyebrow">02 / Discoverability &amp; state</p>
          <h2>Finding the mode is only the first step.</h2>
          <p>The interface needed to make the entry recognizable and show when Temporary Chat was active throughout the conversation.</p>
          <p>I explored entry-point treatments and icons to make Temporary Chat easy to find and its active state easy to recognize. These cues were intended to support people discussing personal topics by giving them a visible state to check during the conversation.</p>
        </section>

        <section id="motion" class="story-section">
          <p class="eyebrow">03 / Motion exploration (not shipped)</p>
          <h2>Let the transition tell one story, in both directions.</h2>
          <p>One concept paired entry and exit animations. On entry, the interface moved from a standard conversation to a fresh screen labeled Temporary Chat. On exit, the conversation blurred as the interface returned to the standard start screen.</p>
          <p>The Design Council responded positively to the paired concept. Its motion made the intended mode switch visible.</p>
          <figure class="temporary-chat-motion">
            <h3>Entering Temporary Chat</h3>
            <video controls muted playsinline preload="none" width="2878" height="2158" poster="/assets/temporary-chat-enter-poster.webp" aria-label="Temporary Chat entrance motion, an unshipped concept" aria-describedby="temporary-chat-enter-caption">

          </figure>
          <figure class="temporary-chat-motion">
            <h3>Leaving Temporary Chat</h3>
            <video controls muted playsinline preload="none" width="2874" height="1854" poster="/assets/temporary-chat-exit-poster.webp" aria-label="Temporary Chat exit motion, an unshipped concept" aria-describedby="temporary-chat-exit-caption">
              <source src="/assets/temporary-chat-exit-motion.mp4" type="video/mp4">
            </video>
            <figcaption id="temporary-chat-exit-caption">Unshipped exit exploration: the conversation blurs as the interface returns to the standard start screen. <a class="case-image-link" href="/assets/temporary-chat-exit-motion.mp4" target="_blank" rel="noopener noreferrer">Open the exit motion file <span class="sr-only">(opens in a new tab)</span></a></figcaption>
          </figure>
        </section>

        <section id="adaptation" class="story-section">
          <p class="eyebrow">04 / Shipped adaptation</p>
          <h2>Keep the active state clear without animation.</h2>
          <p>Implementation constraints kept both transition animations out of the launch. The interface still needed to make the active mode clear without relying on motion.</p>
          <dl class="format-directions">
            <div><dt>Explored<br> not shipped</dt><dd>The paired entry and exit animations made the mode change expressive. The concept received positive feedback from the Design Council, but neither animation shipped.</dd></div>
            <div><dt>Adapted<br> and shipped</dt><dd>I changed the mode control from toggle styling to primary-button styling, making the active Temporary Chat state more prominent without relying on motion.</dd></div>
          </dl>
          <p>The control made the active mode more visible during the conversation, preserving the intent of the unshipped transitions.</p>
        </section>

        <section id="delivery" class="story-section">
          <p class="eyebrow">05 / Delivery</p>
          <h2>The mode shipped on web and mobile.</h2>
          <p>The shipped version used primary-button styling to make the active mode more prominent. The paired transitions remained a design exploration.</p>
          <p>The primary-button styling shipped on web and mobile, keeping the active-mode cue visible during the conversation. It was designed to make the intended boundary of Temporary Chat easier to recognize.</p>
        </section>

        <section id="takeaway" class="story-section outcome-section">
          <p class="eyebrow">06 / Design takeaway</p>
          <h2>Clarity has to last beyond the transition.</h2>
          <p>The entry can set expectations, but people still need a recognizable cue once they are in the mode. I learned to treat discovery and the active state as one continuous experience, then adapt the design to what could ship.</p>
        </section>
