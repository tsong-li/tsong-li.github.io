      <h1 id="case-title">Tax CTI: keep the workflow; make the prototype fit the system<span class="accent-text">.</span></h1>
      <p class="case-principle">I used AI to prototype a complex tax workflow, then narrowed its scope and rebuilt it with feedback from finance and engineering.</p>
      <dl class="case-facts" aria-label="At a glance">
        <div><dt>Context</dt><dd>Microsoft Advertising tax operations</dd></div>
        <div><dt>My role</dt><dd>Product design, AI-assisted prototyping, and cross-functional collaboration</dd></div>
        <div><dt>Focus</dt><dd>Clarifying and validating a three-stage tax-record workflow</dd></div>
        <div><dt>Handoff</dt><dd>Agreed logic incorporated into the PRD for engineering</dd></div>
      </dl>
    </section>

      <div class="story-sections">
        <section id="ambiguity" class="story-section">
          <p class="eyebrow">01 / Make requirements concrete</p>
          <h2>Turn scattered requirements into something people can review.</h2>
          <p>The tax-exemption operations request was complex, with requirements spread across a PRD and business-process documents. I started with the Microsoft Ads Platform shell, which included the design system and common patterns, and brought the requirements and workflow into VibeCanvas.</p>
          <p>With AI coding assistance, I turned those documents into an interactive first proposal. Separate prototype branches let me compare directions and retain earlier versions, giving finance stakeholders and developers a working proposal to review.</p>
        </section>

        <figure class="tax-cti-walkthrough-figure">
          <h3>Initial prototype walkthrough</h3>
          <video controls muted playsinline preload="none" width="1920" height="1080" poster="/assets/tax-cti-initial-poster.webp" aria-label="Initial Tax CTI prototype walkthrough with narration, muted by default" aria-describedby="tax-cti-initial-caption">
            <source src="/assets/tax-cti-initial-prototype.mp4" type="video/mp4">
          </video>
          <figcaption id="tax-cti-initial-caption">An early exploration of the tax-record workflow, before review narrowed its scope. Turn on sound in the player controls.</figcaption>
        </figure>

        <section id="feedback" class="story-section">
          <p class="eyebrow">02 / Narrow the workflow</p>
          <h2>The first proposal helped reveal what the workflow did not need.</h2>
          <p>The first version explored a dashboard, bulk updates, record history, and additional guidance. During review, finance stakeholders and developers agreed that a broader operations console was unnecessary. The task was to upload records, choose an update, validate the records, submit valid ones, and resolve failures.</p>
          <p>I narrowed the workflow to three stages: Prepare, Validate, and Results. Batch actions included marking records as exempt or taxable and recording certificate-review outcomes. I left out the unnecessary reporting and history views to keep the workflow focused on processing tax records and reviewing results.</p>
        </section>

        <section id="requirements" class="story-section">
          <p class="eyebrow">03 / Keep requirements current</p>
          <h2>Reconcile changes before carrying a decision forward.</h2>
          <p>Requirements kept changing after the first review. I used WorkIQ to compare the latest SharePoint PRD updates and comments with the earlier version, distinguishing confirmed changes from open questions.</p>
          <p>I incorporated confirmed feedback into a new prototype branch and kept open questions visible for review. This gave the team an updated proposal without treating unresolved assumptions as requirements.</p>
          <figure class="tax-cti-walkthrough-figure">
            <video controls muted playsinline preload="none" width="1816" height="1080" poster="/assets/tax-cti-walkthrough-poster.webp" aria-label="Tax CTI design walkthrough with narration, muted by default" aria-describedby="tax-cti-walkthrough-caption">
              <source src="/assets/tax-cti-walkthrough.mp4" type="video/mp4">
            </video>
            <figcaption id="tax-cti-walkthrough-caption">This narrated walkthrough shows how I used VibeCanvas to clarify requirements, compare prototypes, and apply the platform's design system to Tax CTI. Turn on sound in the player controls.</figcaption>
          </figure>
        </section>

        <section id="rebuild" class="story-section">
          <p class="eyebrow">04 / Fit the platform system</p>
          <h2>Make the working prototype fit the system it would use.</h2>
          <p>Frontend review found that the first interface resembled the platform but did not use its Storybook components. I kept the reviewed workflow and rebuilt the prototype with the platform's components, design tokens, and established patterns.</p>
          <figure class="tax-cti-visual tax-cti-stage-figure">
            <h3>Exploration</h3>
            <picture>
              <source type="image/webp" srcset="/assets/tax-cti-exploration-800.webp 800w, /assets/tax-cti-exploration-1600.webp 1600w, /assets/tax-cti-exploration-2400.webp 2400w" sizes="(max-width: 600px) calc(100vw - 40px), (max-width: 1100px) calc(100vw - 64px), (max-width: 1264px) calc(100vw - 96px), 1168px">
              <img src="/assets/tax-cti-exploration.png" width="3456" height="2168" loading="lazy" decoding="async" alt="Exploration prototype showing Prepare updates, Review, and Results stages with certificate-review options and a CSV upload area.">
            </picture>
            <figcaption>Exploration: a guided tax-record update flow with certificate-review options and a CSV input area.</figcaption>
            <a class="case-image-link" href="/assets/tax-cti-exploration.png" target="_blank" rel="noopener noreferrer">View full-size CTI Exploration <span class="sr-only">(opens in a new tab)</span></a>
          </figure>
          <p>The rebuilt prototype gave developers the reviewed workflow in the components and tokens they would use. It served as a design handoff; the full backend and operations tool were not being presented as shipped.</p>
          <figure class="tax-cti-visual tax-cti-stage-figure">
            <h3>System-aligned prototype</h3>
            <picture>
              <source type="image/webp" srcset="/assets/tax-cti-system-aligned-800.webp 800w, /assets/tax-cti-system-aligned-1600.webp 1600w, /assets/tax-cti-system-aligned-2400.webp 2400w" sizes="(max-width: 600px) calc(100vw - 40px), (max-width: 1100px) calc(100vw - 64px), (max-width: 1264px) calc(100vw - 96px), 1168px">
              <img src="/assets/tax-cti-system-aligned.png" width="3456" height="2168" loading="lazy" decoding="async" alt="System-aligned prototype showing a Customer Tax Indicator workspace, bulk tax-record updates, value guidance, and recent update runs.">
            </picture>
            <figcaption>System-aligned prototype: bulk apply shown within the broader Customer Tax Indicator workspace, alongside CTI value rules and recent bulk runs.</figcaption>
            <a class="case-image-link" href="/assets/tax-cti-system-aligned.png" target="_blank" rel="noopener noreferrer">View full-size System-aligned Prototype <span class="sr-only">(opens in a new tab)</span></a>
          </figure>
          <p>The interface changed while the workflow stayed stable. Finance partners could continue reviewing the agreed logic, and frontend partners could assess how it worked with their components.</p>
        </section>

        <section id="handoff" class="story-section outcome-section">
          <p class="eyebrow">05 / Hand off validated decisions</p>
          <h2>Carry the agreed workflow into engineering.</h2>
          <p>After finance stakeholders reviewed the focused workflow, I added the agreed logic to the PRD for engineering. The handoff included a finance-reviewed prototype built with the platform's design system and a clearer reference for implementation.</p>
          <p>After handoff, I heard that the production frontend closely followed the prototype's Storybook components and tokens, helping limit implementation effort and repeated rework.</p>
          <p>The prototype gave the team something to discuss. Review helped us understand the work, narrow the scope, and use the system the team would build with.</p>
        </section>
