      <div class="story-sections">
        <section id="context" class="story-section">
          <p class="eyebrow">01 / Overview &amp; context</p>
          <h2>Let the conversation follow the person’s priorities.</h2>
          <p>Searching for a financial product can mean switching websites, filling out the same information repeatedly, and comparing terms that are hard to line up. The broader Copilot vision aimed to support more of that process, from comparison and application to managing fees and renewals over time. My work focused on credit-card exploration, using conversation to help people clarify their goals and weigh their options.</p>
          <p>A fixed questionnaire can feel restrictive when people's priorities change as they learn more. I explored a conversation where they could explain what mattered in their own words, revisit those needs, and answer follow-up questions to clarify their priorities. I developed the interaction in a prototype with preset scenarios and content.</p>
        </section>

        <section id="contribution" class="story-section">
          <p class="eyebrow">02 / My contribution</p>
          <h2>I brought the idea to life as an interactive prototype.</h2>
          <p>I designed the experience from the ground up, then built and refined an interactive prototype using the One Copilot design language. It combined conversation, comparison formats, and persistent card details. AI helped me implement and iterate the interactions; I set the design direction and decided what to change. Reviewers and participants could follow a specific need through the flow and see the supporting information alongside the conversation.</p>
          <p>The working interactions gave reviewers more to discuss and test than static screens alone.</p>
        </section>

        <section id="decisions" class="story-section">
          <p class="eyebrow">03 / Design decisions</p>
          <h2>Keep the conversation open, but give it shape.</h2>
          <p>I made three design choices to keep the conversation flexible and the comparisons easy to follow.</p>
          <dl class="format-directions">
            <div><dt>Let priorities<br> change</dt><dd>The conversation opened with a brief question about the person's goal. Follow-up questions could refine their priorities without committing them to a fixed questionnaire.</dd></div>
            <div><dt>Surface the right<br> signals</dt><dd>Cashback, travel rewards, balance transfers, building credit, and lower interest or fees each required different information for comparison, such as rewards, eligibility, potential savings, or credit growth. Cards brought the next useful details into view while allowing the conversation to continue.</dd></div>
            <div><dt>Make value<br> inspectable</dt><dd>A persistent detail panel beside the conversation gave people a place to compare options. It was designed to break down annual value, show break-even points, estimate savings, and explain why an option might fit, with its assumptions and trade-offs. People could inspect those details and return to the conversation without losing context.</dd></div>
          </dl>
          <div class="pf-scenario-evidence" aria-labelledby="pf-detail-title">
            <h3 id="pf-detail-title">The detail changed with the goal.</h3>
            <p>The full board uses a shared hierarchy for card identity, product details, and trust information. The supporting information varies across travel, building credit, cashback, and balance-transfer scenarios. These are prototype examples, not fixed fields or verified product terms.</p>

          </div>
        </section>

        <section id="validation" class="story-section">
          <p class="eyebrow">04 / Prototype &amp; validation</p>
          <h2>An AI-assisted build made the flow interactive.</h2>
          <p>I designed the interaction and used AI assistance to build and refine a working prototype. The full recording follows a goal-led prompt, questions about spending, travel-card comparisons with persistent details, and a path for building credit. Its scenarios and content are preset, not generated by a live model.</p>
          <figure class="pf-video-figure">
            <video controls playsinline muted preload="none" width="1728" height="1080" poster="/assets/personal-finance-ai-interactive-prototype-poster.jpg" aria-label="Full recording of an AI-assisted interactive credit-card prototype, with audio muted by default" aria-describedby="pf-video-caption pf-video-note">
              <source src="/assets/personal-finance-ai-interactive-prototype.mp4" type="video/mp4">
              <a href="/assets/personal-finance-ai-interactive-prototype.mp4">Open the prototype video file</a>
            </video>
            <figcaption id="pf-video-caption">AI-assisted interactive prototype walkthrough, showing goal clarification, travel-card comparisons with persistent details, and a build-credit path.</figcaption>
          </figure>
          <p id="pf-video-note" class="pf-media-note">The complete original 53-second recording has no frames or audio removed; playback starts muted. It shows a prototype, not a launched service.</p>
          <p><a class="pf-prototype-source" href="https://github.com/tsongli_microsoft/personal-finance-credit-card" target="_blank" rel="noopener noreferrer">View prototype source on GitHub <span class="sr-only">(opens in a new tab)</span></a></p>
          <p class="pf-evidence-note">Card terms, estimated values, approval indicators, and review excerpts are illustrative prototype content, not verified offers, eligibility decisions, customer evidence, or live results.</p>
          <p>We used the prototype in design review and rapid user acceptance testing (UAT) to evaluate the credit-card interaction. In a separate insurance exploration, I applied the same goal-led framework to reviewing current policies, identifying gaps or overlap, considering better-fit options, and weighing whether to keep, adjust, or switch policies.</p>
        </section>

        <section id="outcome" class="story-section">
          <p class="eyebrow">05 / Outcome</p>
          <h2>People valued a more direct way to compare.</h2>
          <p>The design passed review, and rapid UAT supported taking the direction further. Participants liked getting recommendations through conversation because they could avoid repeatedly switching websites to compare information.</p>
          <p>Participants also found it easier to identify benefits relevant to their goals in the card details, which helped them compare options.</p>
          <p>The feedback supported giving people a direct answer while keeping details nearby for closer comparison.</p>
        </section>

        <section id="takeaway" class="story-section outcome-section">
          <p class="eyebrow">06 / Design takeaway</p>
          <h2>Make room to understand why a choice might fit.</h2>
          <p>People need to see the available options and understand why one might fit their goal. A useful comparison shows the relevant value, assumptions, and trade-offs while allowing priorities to change during the conversation.</p>
          <p>I came away with a reusable framework for different scenarios, rather than a fixed recommendation path. It starts with a person's goal, presents the information relevant to it, and keeps evidence and context available throughout the comparison.</p>
        </section>
