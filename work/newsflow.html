      <h1 id="case-title">Newsflow: news for the moment you have<span class="accent-text">.</span></h1>
      <p class="case-principle">People can read, listen to, or watch a story, or catch up through a quick digest, depending on the time and attention they have.</p>
      <dl class="case-facts" aria-label="At a glance">

      <div class="story-sections">
        <section id="context" class="story-section">
          <p class="eyebrow">01 / A mismatch of content and moment</p>
          <h2>We don’t lack content.<br>We lack the right way to consume it.</h2>
          <p>News is abundant, but a screen-based feed does not always suit the time or attention people have. They may want to read in depth at a desk, catch the essentials between tasks, or listen away from a screen.</p>
          <p>Inspired by my earlier Copilot Daily work, I started Newsflow as a personal project to explore different ways to follow MSN News content. I wanted to see how the same story could fit different moments in someone's day, without simply adding more stories.</p>
        </section>

        <section id="formats" class="story-section">
          <p class="eyebrow">02 / One story, different ways in</p>
          <h2>Let people choose how much attention to give.</h2>
          <p>Newsflow offers several ways to engage with a story, beyond reading. People can open the article and visit its original publisher, or use Digest for a quick overview when time is short.</p>
          <dl class="format-directions">
            <div><dt>Read</dt><dd>Read the article and keep access to its original publisher.</dd></div>
            <div><dt>Digest</dt><dd>Get a quick overview of the story when you have only a moment.</dd></div>
            <div><dt>Listen</dt><dd>Build a queue, skip between items, pause playback, and choose how much time to spend listening.</dd></div>
            <div><dt>Watch</dt><dd>Show an existing video when one is available; otherwise, tell the story through images and narration.</dd></div>
          </dl>
          <p>People could choose how to follow a story as their day changed: spend time reading it, switch to a shorter format, or use a more hands-free option. There was no fixed sequence to follow.</p>

        <section id="time-budget" class="story-section">
          <p class="eyebrow">03 / Fit a queue to the time available</p>
          <h2>Choose a listening window; let the playlist meet it.</h2>
          <p>I implemented a listening-time option in the online prototype. People choose a duration, and Newsflow adjusts the playlist and narration length to fit it. They can plan around the time they have, instead of assembling a queue without knowing how long it will take.</p>
          <figure class="newsflow-screen newsflow-wide-screen">
            <img src="/assets/newsflow-listen-1600.webp" srcset="/assets/newsflow-listen-800.webp 800w, /assets/newsflow-listen-1600.webp 1600w" sizes="(max-width: 600px) calc(100vw - 40px), (max-width: 800px) calc(100vw - 64px), (max-width: 1100px) calc(100vw - 300px), (max-width: 1264px) calc(100vw - 448px), 816px" width="3456" height="2168" loading="lazy" decoding="async" alt="Newsflow Listen screen showing a radio queue, listening-time choices, and playback controls.">
            <figcaption>Listen: queue, time choices, and playback controls.</figcaption>
            <a class="newsflow-image-link" href="/assets/newsflow-listen.png">View full-size Listen screen</a>
          </figure>
        </section>

        <section id="voice" class="story-section">
          <p class="eyebrow">04 / Designing the listening experience</p>
          <h2>Make audio feel arranged, not queued at random.</h2>
          <p>Tone, timing, and transitions between stories can turn a queue of articles read aloud into a coherent, well-organized show.</p>
          <p>I adapted the narration differently for Listen and Watch. Listen needed a steady spoken flow; Watch needed narration that worked with the visual scenes. Even for the same story, the wording and pace changed with the format.</p>
          <p>Deciding what to emphasize, where to pause, and how to move between stories still requires design judgment.</p>
          <figure class="newsflow-screen newsflow-wide-screen">
            <img src="/assets/newsflow-watch-1600.webp" srcset="/assets/newsflow-watch-800.webp 800w, /assets/newsflow-watch-1600.webp 1600w" sizes="(max-width: 600px) calc(100vw - 40px), (max-width: 800px) calc(100vw - 64px), (max-width: 1100px) calc(100vw - 300px), (max-width: 1264px) calc(100vw - 448px), 816px" width="3456" height="2168" loading="lazy" decoding="async" alt="Newsflow Watch screen showing a narrated visual story with chapter markers and playback controls.">
            <figcaption>Watch: narrated scenes and chapter controls.</figcaption>
            <a class="newsflow-image-link" href="/assets/newsflow-watch.png">View full-size Watch screen</a>
          </figure>
        </section>

        <section id="building" class="story-section">
          <p class="eyebrow">05 / From concept to working system</p>
          <h2>I moved from describing the idea to testing it in use.</h2>
          <p>I conceived and designed the experience, then built it and integrated news fetching and text-to-speech services. I used VS Code Copilot throughout, refining the content, pacing, and interactions through hands-on testing and debugging.</p>
          <p>Integrating real services meant designing for failures too. I added fallback routes so people would still have a usable next step when a service was unavailable.</p>
          <p>I implemented the front-end flows and backend service integrations, then debugged the text-to-speech API in the deployed environment. Working through those issues extended what I could deliver as a designer, from interaction concepts to a working online prototype.</p>
          <p>Building a working prototype mattered to me because I could experience and revise the pacing, transitions, and content choices directly.</p>
        </section>

        <section id="delivery" class="story-section outcome-section">
          <p class="eyebrow">06 / What I took forward</p>
          <h2>AI helped make the idea testable; judgment gave it shape.</h2>
          <p>Newsflow is a personal online prototype, not an official Microsoft or MSN product. Building it let me work through the full experience, from finding stories and shaping narration to testing how the formats worked together.</p>
          <p>The work reinforced my view that each medium needs its own design. Listening to a story calls for a different rhythm from reading or watching it. Tools help build the experience; deciding whether it is clear and coherent still takes human judgment.</p>
          <p>The direction received positive feedback from internal content and design teams.</p>
